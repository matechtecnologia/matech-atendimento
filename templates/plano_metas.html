<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>M.A Tech - Metas</title>
    <link rel="stylesheet" href="/static/app.min.css?v=310930">
    <style>
        body { background:#0a0a0a; color:#e8e8e8; font-family:sans-serif; margin:0; }
        .topo { background:#0f1a15; padding:16px 24px; border-bottom:1px solid #00d97e33; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .topo h1 { color:#00d97e; font-size:20px; margin:0; }
        .menu a { color:#e8e8e8; text-decoration:none; margin-left:16px; font-size:14px; }
        .container { max-width:1000px; margin:24px auto; padding:0 24px; }
        .meta { background:#141414; border:1px solid #2a2a2a; border-left:3px solid #00d97e; border-radius:8px; padding:20px; margin-bottom:16px; }
        .meta h2 { color:#e8e8e8; font-size:16px; margin:0 0 8px 0; }
        .meta p { color:#8a8a8a; font-size:13px; margin:6px 0; }
        .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700; text-transform:uppercase; background:#1a1a1a; color:#8a8a8a; border:1px solid #3a3a3a; }
        .barra { height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden; margin-top:8px; }
        .barra-preenchida { height:100%; background:#00d97e; }
        .valores { display:flex; gap:24px; margin-top:12px; font-family:monospace; flex-wrap:wrap; }
        .valores strong { color:#00d97e; }
        .aviso { background:#0a1f15; border-left:3px solid #00d97e; padding:12px; border-radius:6px; margin-bottom:16px; color:#00d97e; font-size:14px; }
        .form-inline { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid #2a2a2a; align-items:flex-end; }
        .form-inline input, .form-inline select { background:#0a0a0a; border:1px solid #2a2a2a; color:#fff; padding:8px 12px; border-radius:6px; font-size:13px; font-family:inherit; }
        .form-inline label { color:#8a8a8a; font-size:11px; display:block; margin-bottom:4px; }
        .btn { display:inline-block; padding:8px 16px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; border:1px solid; background:#00d97e; color:#0a0a0a; border-color:#00d97e; }
    </style>
</head>
<body>
<div class="topo">
    <h1>Metas M.A Tech</h1>
    <div class="menu">
        <a href="/plano">Dashboard</a>
        <a href="/plano/roadmap">Roadmap</a>
        <a href="/plano/metas">Metas</a>
        <a href="/plano/tarefas">Tarefas</a>
        <a href="/plano/diario">Diario</a>
        <a href="/admin/dashboard">Voltar Admin</a>
    </div>
</div>
<div class="container">
    {% if ok %}<div class="aviso">Alteracao salva</div>{% endif %}
    {% for m in metas %}
        <div class="meta">
            <h2>{{ m.titulo }} <span class="badge" style="float:right;">{{ m.status }}</span></h2>
            <p>{{ m.descricao or "" }}</p>
            <div class="valores">
                <span>Atual: <strong>{{ m.valor_atual }}</strong></span>
                <span>Meta: <strong>{{ m.valor_meta }} {{ m.unidade or "" }}</strong></span>
                <span>Progresso: <strong>{{ m.pct }}%</strong></span>
            </div>
            <div class="barra"><div class="barra-preenchida" style="width:{{ m.pct }}%;"></div></div>
            <form method="POST" action="/plano/meta/{{ m.id }}/atualizar" class="form-inline">
                <div>
                    <label>Valor atual</label>
                    <input type="text" name="valor_atual" value="{{ m.valor_atual }}" required style="width:100px;">
                </div>
                <div>
                    <label>Status</label>
                    <select name="status">
                        <option value="nao_iniciado" {% if m.status == 'nao_iniciado' %}selected{% endif %}>Nao iniciado</option>
                        <option value="em_andamento" {% if m.status == 'em_andamento' %}selected{% endif %}>Em andamento</option>
                        <option value="concluido" {% if m.status == 'concluido' %}selected{% endif %}>Concluido</option>
                        <option value="validado" {% if m.status == 'validado' %}selected{% endif %}>Validado</option>
                        <option value="bloqueado" {% if m.status == 'bloqueado' %}selected{% endif %}>Bloqueado</option>
                    </select>
                </div>
                <button type="submit" class="btn">ATUALIZAR</button>
            </form>
        </div>
    {% endfor %}
</div>
</body>
</html>
