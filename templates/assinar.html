<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>M.A Tech - Assinar {{ plano }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-atendimento">
        <div class="topo">
            <h1>M.A Tech</h1>
            <div class="usuario-info">
                <span>{{ usuario_nome }}</span>
                <a href="/planos">← Planos</a>
                <a href="/logout">Sair</a>
            </div>
        </div>

        <div class="bloco bloco-fala">
            <h2>Assinar Plano {{ plano|upper }}</h2>
            <p style="color:#aaa; margin-top:8px;">Valor: R$ {{ valor }}</p>
        </div>

        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/gerar_pix">
            <input type="hidden" name="plano" value="{{ plano }}">
            <input type="hidden" name="valor" value="{{ valor }}">

            <div class="campo">
                <label>CPF ou CNPJ (só números)</label>
                <input type="text" name="cpf_cnpj" required placeholder="Digite seu CPF ou CNPJ (só números)" maxlength="14" autofocus>
            </div>

            <button type="submit" class="btn-gerar">GERAR PIX</button>
        </form>
    </div>
</body>
</html>
