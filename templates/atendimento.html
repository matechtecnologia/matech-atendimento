<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>M.A Tech - Atendimento</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-atendimento">
        <div class="topo">
            <h1>M.A Tech</h1>
            <div class="usuario-info">
                <span>{{ usuario_nome }}</span>
                <a href="/meus_nichos">Meus Nichos</a>
                <a href="/logout">Sair</a>
            </div>
        </div>

        <form method="POST" action="/gerar_resposta">
            <div class="campo">
                <label>Nicho</label>
                <select name="nicho_id" required>
                    {% for n in nichos %}
                    <option value="{{ n.id }}">{{ n.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label>WhatsApp do cliente (só números)</label>
                <input type="text" name="whatsapp" required placeholder="Ex: 11987654321">
            </div>

            <div class="campo">
                <label>Linha CRM (estado atual do cliente)</label>
                <textarea name="linha_crm" rows="3" placeholder="Cole a linha da planilha" required>{{ linha_crm or '' }}</textarea>
            </div>

            <div class="campo">
                <label>O que o cliente falou agora (ou instrução)</label>
                <textarea name="mensagem_cliente" rows="3" placeholder="Cole o que o cliente disse" required>{{ mensagem_cliente or '' }}</textarea>
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" name="modo_instrucao" value="1" style="width:auto; margin-right:8px;">
                    Isso é uma INSTRUÇÃO (não é fala do cliente)
                </label>
            </div>

            <button type="submit" class="btn-gerar">GERAR RESPOSTA</button>
        </form>
    </div>
</body>
</html>
