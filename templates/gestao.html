<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Empresarial - M.A Tech</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#0a0a0a; color:#e5e5e5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:48px 32px; max-width:480px; width:100%; text-align:center; }
.icone { font-size:56px; margin-bottom:20px; }
h1 { font-size:1.4rem; color:#fff; margin-bottom:12px; }
p { color:#b5b5b5; font-size:.95rem; line-height:1.7; margin-bottom:8px; }
.destaque { color:#10b981; font-weight:600; }
.btn { display:inline-block; background:#10b981; color:#000; text-decoration:none; padding:14px 32px; border-radius:10px; font-weight:600; font-size:.95rem; margin-top:24px; }
.btn:hover { background:#0ea371; }
</style>
</head>
<body>
<div class="card">
  <div class="icone">📊</div>
  <h1>Gestão Empresarial</h1>
  <p>O próximo produto da <span class="destaque">M.A Tech</span>.</p>
  <p>Painel completo com receitas, despesas, DRE simplificado, fluxo de caixa e indicadores — tudo conectado ao seu Atendimento.</p>
  <p style="margin-top:20px; color:#10b981; font-weight:600;">Em breve</p>
  <a href="/hub" class="btn">Voltar pras áreas</a>
</div>
</body>
</html>
