<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.A Tech - Tempo - {% if compromisso %}Editar{% else %}Novo{% endif %}</title>
<link rel="stylesheet" href="/static/app.min.css?v=310930">
<style>
body { padding-bottom: 90px; }
.card-fin { background:#141414; border:1px solid #222; border-radius:12px; padding:20px; margin-bottom:14px; }
.card-fin .lbl { font-size:11px; color:#8a8a8a; text-transform:uppercase; letter-spacing:0.08em; font-weight:800; margin-bottom:12px; }
.card-fin label { display:block; font-size:11px; color:#8a8a8a; text-transform:uppercase; font-weight:800; margin:10px 0 4px; }
.card-fin input, .card-fin textarea, .card-fin select { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2a2a; background:#0a0a0a; color:#e8e8e8; font-family:inherit; font-size:14px; box-sizing:border-box; }
.card-fin textarea { min-height:80px; resize:vertical; }
.linha-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card-fin .acoes { display:flex; gap:10px; margin-top:14px; }
.card-fin .acoes a, .card-fin .acoes button { flex:1; text-align:center; padding:12px; border-radius:8px; border:none; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; text-decoration:none; }
.btn-p { background:#00d97e; color:#0a0a0a; }
.btn-s { background:#161616; color:#8a8a8a; border:1px solid #2a2a2a !important; }
.btn-d { background:#161616; color:#ff5555; border:1px solid #3a1818 !important; }
@media (max-width:500px){ .linha-2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container-atendimento">
  <div class="topo">
    <h1>M.A <span style="color:#10b981">Tech</span></h1>
    <div class="usuario-info">
      <span>{{ usuario_nome or '' }}</span>
      <a href="/planos">Planos</a>
      {% if usuario_tipo == 'admin' %}<a href="/admin">Admin</a>{% endif %}
      <a href="https://wa.me/5512997291583" target="_blank" rel="noopener">Suporte</a>
      <a href="/logout">Sair</a>
    </div>
  </div>
  <h2 style="color:#fff;margin-bottom:16px;">&#9200; Tempo</h2>

  <div class="card-fin">
    <div class="lbl">{% if compromisso %}Editar compromisso{% else %}Novo compromisso{% endif %}</div>

    <form method="POST" action="{% if compromisso %}/gestao/pessoal/tempo/compromisso/{{ compromisso.id }}{% else %}/gestao/pessoal/tempo/novo{% endif %}">
      <label>Titulo</label>
      <input type="text" name="titulo" required value="{% if pre and pre.titulo %}{{ pre.titulo }}{% elif compromisso %}{{ compromisso.titulo }}{% endif %}">

      <div class="linha-2">
        <div>
          <label>Data</label>
          <input type="date" name="data" required value="{% if pre and pre.data %}{{ pre.data }}{% elif compromisso %}{{ compromisso.data }}{% else %}{{ hoje }}{% endif %}">
        </div>
        <div>
          <label>Prioridade</label>
          <select name="prioridade">
            <option value="alta" {% if compromisso and compromisso.prioridade=='alta' %}selected{% endif %}>Alta</option>
            <option value="media" {% if not compromisso or compromisso.prioridade=='media' %}selected{% endif %}>Media</option>
            <option value="baixa" {% if compromisso and compromisso.prioridade=='baixa' %}selected{% endif %}>Baixa</option>
          </select>
        </div>
      </div>

      <div class="linha-2">
        <div>
          <label>Hora inicio</label>
          <input type="time" name="hora_inicio" value="{% if pre and pre.hora_inicio %}{{ pre.hora_inicio }}{% elif compromisso and compromisso.hora_inicio %}{{ compromisso.hora_inicio }}{% endif %}">
        </div>
        <div>
          <label>Hora fim</label>
          <input type="time" name="hora_fim" value="{% if pre and pre.hora_fim %}{{ pre.hora_fim }}{% elif compromisso and compromisso.hora_fim %}{{ compromisso.hora_fim }}{% endif %}">
        </div>
      </div>

      <label>Categoria</label>
      <select name="categoria">
        <option value="">--</option>
        <option value="trabalho" {% if compromisso and compromisso.categoria=='trabalho' %}selected{% endif %}>Trabalho</option>
        <option value="pessoal" {% if compromisso and compromisso.categoria=='pessoal' %}selected{% endif %}>Pessoal</option>
        <option value="saude" {% if compromisso and compromisso.categoria=='saude' %}selected{% endif %}>Saude</option>
        <option value="estudo" {% if compromisso and compromisso.categoria=='estudo' %}selected{% endif %}>Estudo</option>
        <option value="familia" {% if compromisso and compromisso.categoria=='familia' %}selected{% endif %}>Familia</option>
      </select>

      <label>Local</label>
      <input type="text" name="local" value="{{ compromisso.local if compromisso and compromisso.local else '' }}">

      <label>Descricao</label>
      <textarea name="descricao">{{ compromisso.descricao if compromisso and compromisso.descricao else '' }}</textarea>

      <div class="acoes">
        <a href="/gestao/pessoal/tempo" class="btn-s">Cancelar</a>
        <button type="submit" class="btn-p">{% if compromisso %}SALVAR{% else %}CRIAR{% endif %}</button>
      </div>
    </form>

    {% if compromisso %}
    <form method="POST" action="/gestao/pessoal/tempo/compromisso/{{ compromisso.id }}/deletar" onsubmit="return confirm('Deletar este compromisso?')" style="margin-top:10px;">
      <div class="acoes">
        <button type="submit" class="btn-d">DELETAR</button>
      </div>
    </form>
    {% endif %}
  </div>
</div>
<script src="/static/app.min.js?v=2"></script>
<script src="/static/loading_global.js?v=4"></script>
</body>
</html>
