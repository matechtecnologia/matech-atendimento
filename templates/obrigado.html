<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro concluído - M.A Tech</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#0a0a0a; color:#e5e5e5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:48px 32px; max-width:480px; width:100%; text-align:center; }
.check { width:72px; height:72px; border-radius:50%; background:rgba(16,185,129,.12); border:2px solid #10b981; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:36px; color:#10b981; }
h1 { font-size:1.5rem; color:#fff; margin-bottom:12px; }
p { color:#b5b5b5; font-size:.95rem; line-height:1.6; margin-bottom:8px; }
.destaque { color:#10b981; font-weight:600; }
.passos { text-align:left; background:#0d0d0d; border:1px solid #1e1e1e; border-radius:10px; padding:20px; margin:24px 0; }
.passos h3 { font-size:.85rem; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.passos ol { padding-left:20px; color:#c5c5c5; font-size:.9rem; line-height:1.9; }
.btn { display:inline-block; background:#10b981; color:#000; text-decoration:none; padding:14px 32px; border-radius:10px; font-weight:600; font-size:.95rem; margin-top:8px; transition:.2s; }
.btn:hover { background:#0ea371; }
.rodape { margin-top:24px; font-size:.8rem; color:#666; }
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1>Cadastro concluído!</h1>
  <p>Bem-vindo à <span class="destaque">M.A Tech</span>.</p>
  <p>Sua conta foi criada com sucesso.</p>

  <div class="passos">
    <h3>Próximos passos</h3>
    <ol>
      <li>Faça login na plataforma</li>
      <li>Configure seu atendimento com IA</li>
      <li>Comece a responder seus clientes</li>
    </ol>
  </div>

  <a href="/login?criado=1&lead=1" class="btn">Entrar agora &rarr;</a>

  <p class="rodape">Qualquer dúvida: matechtecnologia01@gmail.com</p>
</div>
</body>
</html>
