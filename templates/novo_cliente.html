<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A Tech - Novo Cliente</title>
    <link rel="stylesheet" href="/static/app.min.css?v=99">
</head>
<body>
    <div class="container-atendimento">
        <div class="topo">
            <h1>M.A Tech</h1>
            <div class="usuario-info">
                <span>{{ usuario_nome }}</span>
                <a href="/clientes?nicho_id={{ nicho.id }}">Voltar</a>
                <a href="/logout">Sair</a>
            </div>
        </div>

        <div style="background:#0f1a15;border:1px solid #00d97e;border-radius:12px;padding:14px 16px;margin-bottom:14px;">
            <div style="color:#8a8a8a;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Nicho</div>
            <div style="color:#00d97e;font-size:16px;font-weight:700;">{{ nicho.nome }}</div>
        </div>

        {% if erro %}
        <div style="background:#1f0a0a;border-left:3px solid #ff3b3b;color:#ff3b3b;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:13px;">
            {{ erro }}
        </div>
        {% endif %}

        <div style="background:#141414;border:1px solid #222;border-radius:12px;padding:18px;">
            <form method="POST" action="/cliente/novo">
                <input type="hidden" name="nicho_id" value="{{ nicho.id }}">

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">WhatsApp *</label>
                <input type="text" name="whatsapp" required placeholder="11987654321" inputmode="numeric" pattern="[0-9]+" style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:monospace;box-sizing:border-box;margin-bottom:12px;">

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">Nome *</label>
                <input type="text" name="nome" required style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;">

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">Email</label>
                <input type="email" name="email" style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;">

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">Origem</label>
                <input type="text" name="origem" style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;">

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">Status</label>
                <select name="status" style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:12px;">
                    <option value="novo lead">Novo Lead</option>
                    <option value="em atendimento">Em Atendimento</option>
                    <option value="negociação">Negociação</option>
                    <option value="cliente">Cliente</option>
                    <option value="perdido">Perdido</option>
                </select>

                <label style="display:block;color:#a8a8a8;font-size:12px;font-weight:600;margin-bottom:5px;">Observações</label>
                <textarea name="observacoes" rows="3" style="width:100%;background:#0a0a0a;color:#fff;border:1px solid #2a2a2a;padding:12px;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box;resize:vertical;margin-bottom:14px;"></textarea>

                <button type="submit" style="width:100%;padding:14px;background:#00d97e;color:#0a0a0a;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;">Salvar Cliente</button>
            </form>
        </div>
    </div>
    <script src="/static/app.min.js?v=99"></script>
</body>
</html>
