<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>M.A Tech - Atender {{ cliente.nome }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-atendimento">
        <div class="topo">
            <h1>M.A Tech</h1>
            <div class="usuario-info">
                <span>{{ usuario_nome }}</span>
                <a href="/clientes">← Clientes</a>
                <a href="/logout">Sair</a>
            </div>
        </div>

        <div class="bloco bloco-fala">
            <h2>{{ cliente.nome or "Cliente" }}</h2>
            <p style="color:#aaa; margin-top:8px;">WhatsApp: {{ cliente.whatsapp }}</p>
        </div>

        <form method="POST" action="/gerar_resposta">
            <input type="hidden" name="whatsapp" value="{{ cliente.whatsapp }}">
            <input type="hidden" name="cliente_id" value="{{ cliente.id }}">

            <div class="campo">
                <label>Nicho</label>
                <select name="nicho_id" required>
                    {% for n in nichos %}
                    <option value="{{ n.id }}" {% if cliente.nicho_id == n.id %}selected{% endif %}>{{ n.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label>O que o cliente falou agora (ou instrução)</label>
                <textarea name="mensagem_cliente" rows="4" placeholder="Cole aqui a mensagem do cliente" required autofocus></textarea>
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" name="modo_instrucao" value="1" style="width:auto; margin-right:8px;">
                    Isso é uma INSTRUÇÃO (não é fala do cliente)
                </label>
            </div>

            <button type="submit" class="btn-gerar">GERAR RESPOSTA</button>
        </form>
    </div>
</body>
</html>
