<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A Tech - Criar Conta</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-login">
        <div style="text-align:center; margin-bottom:8px;">
            <span class="badge-status status-em-atendimento" style="font-size:11px;">🎁 1 NICHO GRÁTIS</span>
        </div>
        <h1 style="text-align:center;">M.A Tech</h1>
        <p class="subtitulo" style="text-align:center;">Criar conta grátis — sem cartão</p>

        {% if erro %}
        <div class="erro">⚠️ {{ erro }}</div>
        {% endif %}

        <form method="POST" action="/signup">
            <label>Nome completo</label>
            <input type="text" name="nome" required autofocus placeholder="Seu nome">

            <label>Email</label>
            <input type="email" name="email" required placeholder="voce@email.com">

            <label>WhatsApp (só números, com DDD)</label>
            <input type="text" name="whatsapp" required placeholder="11987654321" inputmode="numeric" pattern="[0-9]+" style="font-family:monospace;">
            <p style="color:#5a5a5a; font-size:12px; margin-top:6px;">Aceita com ou sem o 9 na frente. Ex: 1187654321 ou 11987654321</p>

            <label>Senha (mínimo 6 caracteres)</label>
            <input type="password" name="senha" required minlength="6" placeholder="••••••">

            <button type="submit">CRIAR CONTA GRÁTIS →</button>
        </form>

        <p style="color:#8a8a8a; text-align:center; margin-top:24px; font-size:14px;">
            Já tem conta? <a href="/login" style="color:#00d97e; text-decoration:none; font-weight:600;">Entrar</a>
        </p>

        <p style="color:#5a5a5a; text-align:center; margin-top:20px; font-size:12px; line-height:1.5;">
            Ao criar conta você concorda em usar a plataforma com responsabilidade.
        </p>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
